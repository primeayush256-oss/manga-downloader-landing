<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Manga Manhwa Downloader — one click, whole chapter</title>
    <meta
      name="description"
      content="Manga Manhwa Downloader is a Chrome extension for downloading manga chapters directly from the pages you read. Every account includes 20 free pages, then unlimited downloads from ₹99/month."
    />
    <link rel="canonical" href="https://mangadownloader.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Manga Manhwa Downloader — one click, whole chapter"
    />
    <meta
      property="og:description"
      content="A fast and simple Chrome extension for downloading manga chapters directly from the pages you read. 20 free pages included with every account."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://mangadownloader.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Manga Manhwa Downloader — one click, whole chapter"
    />
    <meta
      name="twitter:description"
      content="A fast and simple Chrome extension for downloading manga chapters directly from the pages you read. 20 free pages included with every account."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- The extension's own icon, used verbatim as the site mark. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icon128.png" />

    <!-- Matches --void from the extension's popup.css -->
    <meta name="theme-color" content="#070b16" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
